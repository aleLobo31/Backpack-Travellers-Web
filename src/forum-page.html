<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Mochilero - Camino de Ulises</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/styles-forum.css">

</head>

<body>

    <!-- HEADER -->
    <header>
        <nav class="nav">

            <!-- IZQUIERDA: LOGO + MENÚ -->
            <div class="nav-left">
                <div class="logo">
                    <img src="images/logo.png" alt="webLogo">
                </div>
                
                <ul class="nav-menu">
                    <li><a href="main-page.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="main-page.html#continentes" data-i18n="nav.continents">Continentes</a></li>
                    <li><a href="forum-page.html" data-i18n="nav.forum">Foro</a></li>
                    <li><a href="footer-sites.html?section=quienes-somos" data-i18n="nav.about">¿Quiénes somos?</a></li>
                </ul>
            </div>

            <!-- DERECHA: ICONOS Y BOTONES -->
            <div class="nav-right">
                <button class="icon-btn hamburger-btn" id="hamburger-btn" aria-label="Abrir menú">
                    ☰
                </button>
                <div class="language-wrapper">
                    <button class="icon-btn" id="language-btn">🌐︎</button>
                    <div id="language-menu" class="language-menu">
                        <button data-lang="es">🇪🇸 Español</button>
                        <button data-lang="en">🇬🇧 English</button>
                    </div>
                </div>
                <!-- Zona auth dinámica -->
                <div class="user-area" id="user-area">
                </div>
            </div>

        </nav>
        <!-- MENÚ MÓVIL -->
        <div class="mobile-menu" id="mobile-menu">
            <div class="mobile-menu-content">

                <!-- AUTH -->
                <div class="mobile-auth" id="mobile-auth">
                    <!-- aquí se clona login / register o user -->
                </div>

                <hr>

                <!-- IDIOMA -->
                <div class="mobile-language">
                    <button data-lang="es">🇪🇸 Español</button>
                    <button data-lang="en">🇬🇧 English</button>
                </div>

            </div>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL DEL FORO -->
    <main class="forum-main">
        
        <!-- TÍTULO PRINCIPAL DEL FORO CON BOTÓN DENTRO -->
        <section class="forum-header">
            <div class="forum-header-content">
                <h1 class="forum-title">FORO MOCHILERO</h1>
                <p class="forum-subtitle">Cuéntanos tu experiencia</p>
                <a href="#" class="btn-contribute">Aportar al foro</a>
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS Y CATEGORÍAS -->
        <div class="filter-section">
            <!-- CATEGORÍAS (IZQUIERDA) -->
            <aside class="categories-panel">
                <h2 class="panel-title">Categorías</h2>
                <ul class="categories-list">
                    <li>
                        <label class="category-item">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Destinos
                        </label>
                    </li>
                    <li>
                        <label class="category-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Compañeros de viaje
                        </label>
                    </li>
                    <li>
                        <label class="category-item">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Presupuesto y ahorros
                        </label>
                    </li>
                    <li>
                        <label class="category-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Seguridad y visados
                        </label>
                    </li>
                    <li>
                        <label class="category-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Viajar con mascotas
                        </label>
                    </li>
                </ul>
            </aside>

            <!-- FILTROS (DERECHA) -->
            <aside class="filters-panel">
                <h2 class="panel-title">Filtros</h2>
                <ul class="filters-list">
                    <li>
                        <label class="filter-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Sólo post verificados
                        </label>
                    </li>
                    <li>
                        <label class="filter-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Más reciente
                        </label>
                    </li>
                    <li>
                        <label class="filter-item">
                            <input type="checkbox" checked>
                            <span class="checkmark"></span>
                            Más comentados
                        </label>
                    </li>
                </ul>
            </aside>
        </div>

            <!-- POSTS POPULARES -->
        <section class="posts-section">
            <div class="posts-header">
                <h2 class="posts-title">Posts populares</h2>
            </div>
            <div class="posts-container">
                <!-- Los posts se cargarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <!-- IZQUIERDA -->
            <div class="footer-left">
                <p>Camino de Ulises © 2025</p>
            </div>

            <!-- CENTRO (desktop) -->
            <nav class="footer-center">
                <a href="footer-sites.html?section=quienes-somos" data-i18n="footer.about">¿Quiénes somos?</a>
                <a href="footer-sites.html?section=privacidad" data-i18n="footer.privacy">Política de privacidad</a>
                <a href="footer-sites.html?section=faq" data-i18n="footer.faq">FAQs</a>
                <a href="footer-sites.html?section=contacto" data-i18n="footer.contact">Contacto</a>
            </nav>

            <!-- DERECHA (desktop) -->
            <div class="footer-right">
                <a href="#" aria-label="Instagram">
                    <img src="images/icons/instagram.svg" alt="Instagram">
                </a>
                <a href="#" aria-label="TikTok">
                    <img src="images/icons/tiktok.svg" alt="TikTok">
                </a>
                <a href="#" aria-label="X">
                    <img src="images/icons/x.svg" alt="X">
                </a>
                <a href="#" aria-label="YouTube">
                    <img src="images/icons/youtube.svg" alt="YouTube">
                </a>
            </div>

            <!-- HAMBURGER (mobile) -->
            <div class="footer-hamburger">
                <button class="footer-hamburger-btn" id="footer-hamburger-btn" aria-label="Menú footer">☰</button>
                <div class="footer-menu-mobile" id="footer-menu-mobile">
                    <nav class="footer-center">
                        <a href="footer-sites.html?section=quienes-somos" data-i18n="footer.about">¿Quiénes somos?</a>
                        <a href="footer-sites.html?section=privacidad" data-i18n="footer.privacy">Política de privacidad</a>
                        <a href="footer-sites.html?section=faq" data-i18n="footer.faq">FAQs</a>
                        <a href="footer-sites.html?section=contacto" data-i18n="footer.contact">Contacto</a>
                    </nav>
                    <div class="footer-divider"></div>
                    <div class="footer-right">
                        <a href="#" aria-label="Instagram">
                            <img src="images/icons/instagram.svg" alt="Instagram">
                        </a>
                        <a href="#" aria-label="TikTok">
                            <img src="images/icons/tiktok.svg" alt="TikTok">
                        </a>
                        <a href="#" aria-label="X">
                            <img src="images/icons/x.svg" alt="X">
                        </a>
                        <a href="#" aria-label="YouTube">
                            <img src="images/icons/youtube.svg" alt="YouTube">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    
    <script>
        // Script para manejar los checkboxes
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    console.log(`Checkbox ${this.parentElement.textContent.trim()} cambiado a ${this.checked}`);
                });
            });
            
            // Botón para aportar al foro
            const contributeBtn = document.querySelector('.btn-contribute');
            if (contributeBtn) {
                contributeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                });
            }
        });
    </script>
    <script src="scripts/header-auth.js"></script>
    <script src="scripts/forum.js"></script>
    <script src="scripts/footer-hamburger.js"></script>

</body>
</html>
