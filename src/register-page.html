<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de nuevos usuarios - Camino de Ulises</title>
    <link rel="stylesheet" href="style/styles.css">
</head>

<body class="login-page">

    <!-- HEADER -->
    <header>
        <nav class="nav">
            <div class="nav-left">
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="Logo">
                </div>

                <ul class="nav-menu">
                    <li><a href="main-page.html">Home</a></li>
                    <li><a href="main-page.html#continentes">Continentes</a></li>
                    <li><a href="forum-page.html">Foro</a></li>
                    <li><a href="footer-sites.html?section=quienes-somos">¿Quiénes somos?</a></li>
                </ul>
            </div>

            <div class="nav-right">
                <button class="icon-btn">🌐︎</button>
                <button class="icon-btn">♿︎</button>
            </div>
        </nav>
    </header>


    <!-- FORMULARIO -->
    <main class="login-container">

        <div class="login-box register-box">

            <h2>Registro de nuevos usuarios</h2>
            <div class="separator"></div>

            <form class="register-grid" method="post" novalidate>

                <!-- Nombre -->
                <div>
                    <label for="nombre">Nombre*</label>
                    <input type="text" id="nombre" required>
                </div>

                <!-- Apellidos -->
                <div>
                    <label for="apellidos">Apellido/s*</label>
                    <input type="text" id="apellidos" required>
                </div>

                <!-- Email -->
                <div>
                    <label for="email">Correo electrónico*</label>
                    <input type="email" id="email" required>
                </div>

                <!-- Username -->
                <div>
                    <label for="usuario">Nombre de usuario*</label>
                    <input type="text" id="usuario" required>
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="pass">Contraseña*</label>
                    <input type="password" id="pass" required>
                </div>

                <!-- Confirmar -->
                <div>
                    <label for="pass2">Confirmar contraseña*</label>
                    <input type="password" id="pass2" required>
                </div>

                <!-- Fecha nacimiento -->
                <div>
                    <label for="fecha">Fecha de nacimiento*</label>
                    <input type="date" id="fecha" required>
                </div>

                <!-- SUBIR IMAGEN DE PERFIL -->
                <div>
                    <label for="imagen">Foto de perfil*</label>

                    <div class="file-input">
                        <label for="imagen" class="boton-examinar">📂</label>
                        <input type="file" id="imagen" name="imagen" accept=".webp, .png, .jpg, .jpeg">
                        <span id="file-archivo-sel">Ningún archivo seleccionado</span>
                    </div>
                </div>

                <div class="campos-obligatorios">
                    <p>Los campos marcados con * son obligatorios</p>
                </div>

                <!-- POLÍTICA DE PRIVACIDAD -->
                <div class="campo-privacidad policy-check">
                    <input type="checkbox" id="privacidad" name="privacidad" required>

                    <label for="privacidad">
                        Acepto la <a href="#" target="_blank">política de privacidad</a>
                    </label>
                </div>

                <!-- BOTÓN GUARDAR -->
                <button type="submit" class="boton-guardar" disabled>Guardar datos y acceder</button>
            </form>

        </div>
    </main>


    <!-- FOOTER -->
    <footer>
        <div class="footer-content">

            <div class="footer-left">
                <p>Camino de Ulises © 2025</p>
            </div>

            <nav class="footer-center">
                <a href="footer-sites.html?section=quienes-somos">¿Quiénes somos?</a>
                <a href="footer-sites.html?section=privacidad">Política de privacidad</a>
                <a href="footer-sites.html?section=faq">FAQs</a>
                <a href="footer-sites.html?section=contacto">Contacto</a>
            </nav>


            <div class="footer-right">
                <a href="#"><img src="../assets/icons/instagram.svg"></a>
                <a href="#"><img src="../assets/icons/tiktok.svg"></a>
                <a href="#"><img src="../assets/icons/x.svg"></a>
                <a href="#"><img src="../assets/icons/youtube.svg"></a>
            </div>

        </div>
    </footer>

    <!-- MODAL DE MENSAJE -->
    <div id="modal-mensaje" class="modal-oculto">
        <div class="modal-contenido">
            <p id="modal-texto"></p>
            <button id="modal-cerrar">Aceptar</button>
        </div>
    </div>
    <script src="scripts/register.js"></script>
</body>
</html>
