<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>País | TravelWorld</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="style/continent_country.css">
</head>

    <body>

        <!-- HEADER -->
        <header>
            <nav class="nav">

                <!-- IZQUIERDA: LOGO + MENÚ -->
                <div class="nav-left">
                    <div class="logo">
                        <img src="images/logo.png" alt="webLogo">
                    </div>
                    
                    <ul class="nav-menu">
                        <li><a href="main-page.html" data-i18n="nav.home">Home</a></li>
                        <li><a href="main-page.html#continentes" data-i18n="nav.continents">Continentes</a></li>
                        <li><a href="forum-page.html" data-i18n="nav.forum">Foro</a></li>
                        <li><a href="footer-sites.html?section=quienes-somos" data-i18n="nav.about">¿Quiénes somos?</a></li>
                    </ul>
                </div>

                <!-- DERECHA: ICONOS Y BOTONES -->
                <div class="nav-right">
                    <button class="icon-btn hamburger-btn" id="hamburger-btn" aria-label="Abrir menú">
                        ☰
                    </button>
                    <div class="language-wrapper">
                        <button class="icon-btn" id="language-btn">🌐︎</button>
                        <div id="language-menu" class="language-menu">
                            <button data-lang="es">🇪🇸 Español</button>
                            <button data-lang="en">🇬🇧 English</button>
                        </div>
                    </div>
                    <!-- Zona auth dinámica -->
                    <div class="user-area" id="user-area">
                    </div>
                </div>

            </nav>
            <!-- MENÚ MÓVIL -->
            <div class="mobile-menu" id="mobile-menu">
                <div class="mobile-menu-content">

                    <!-- AUTH -->
                    <div class="mobile-auth" id="mobile-auth">
                        <!-- aquí se clona login / register o user -->
                    </div>

                    <hr>

                    <!-- IDIOMA -->
                    <div class="mobile-language">
                        <button data-lang="es">🇪🇸 Español</button>
                        <button data-lang="en">🇬🇧 English</button>
                    </div>

                </div>
            </div>

        </header>

        <!-- TÍTULO DEL PAÍS -->
        <section class="country-header-banner">
            <div class="country-header-content">
                <img id="country-flag" src="#" class="country-flag" alt="Bandera del país">
                <h1 id="country-name">Cargando país...</h1>
                <div class="underline"></div>
                <p id="country-subtitle"></p>
            </div>
        </section>




        <!-- GRID DE CIUDADES -->
        <div class="cities-grid" id="cities-container"></div>

        <!-- SEGURIDAD -->
        <div class="safety-box">
            <p>Infórmate sobre la seguridad en este país</p>
            <a class="safety-button" id="safety-button">Quiero saber más</a>
        </div>

        <!-- FOOTER -->
        <footer>
            <div class="footer-content">
                <!-- IZQUIERDA -->
                <div class="footer-left">
                    <p>Camino de Ulises © 2025</p>
                </div>

                <!-- CENTRO (desktop) -->
                <nav class="footer-center">
                    <a href="footer-sites.html?section=quienes-somos" data-i18n="footer.about">¿Quiénes somos?</a>
                    <a href="footer-sites.html?section=privacidad" data-i18n="footer.privacy">Política de privacidad</a>
                    <a href="footer-sites.html?section=faq" data-i18n="footer.faq">FAQs</a>
                    <a href="footer-sites.html?section=contacto" data-i18n="footer.contact">Contacto</a>
                </nav>

                <!-- DERECHA (desktop) -->
                <div class="footer-right">
                    <a href="#" aria-label="Instagram">
                        <img src="images/icons/instagram.svg" alt="Instagram">
                    </a>
                    <a href="#" aria-label="TikTok">
                        <img src="images/icons/tiktok.svg" alt="TikTok">
                    </a>
                    <a href="#" aria-label="X">
                        <img src="images/icons/x.svg" alt="X">
                    </a>
                    <a href="#" aria-label="YouTube">
                        <img src="images/icons/youtube.svg" alt="YouTube">
                    </a>
                </div>

                <!-- HAMBURGER (mobile) -->
                <div class="footer-hamburger">
                    <button class="footer-hamburger-btn" id="footer-hamburger-btn" aria-label="Menú footer">☰</button>
                    <div class="footer-menu-mobile" id="footer-menu-mobile">
                        <nav class="footer-center">
                            <a href="footer-sites.html?section=quienes-somos" data-i18n="footer.about">¿Quiénes somos?</a>
                            <a href="footer-sites.html?section=privacidad" data-i18n="footer.privacy">Política de privacidad</a>
                            <a href="footer-sites.html?section=faq" data-i18n="footer.faq">FAQs</a>
                            <a href="footer-sites.html?section=contacto" data-i18n="footer.contact">Contacto</a>
                        </nav>
                        <div class="footer-divider"></div>
                        <div class="footer-right">
                            <a href="#" aria-label="Instagram">
                                <img src="images/icons/instagram.svg" alt="Instagram">
                            </a>
                            <a href="#" aria-label="TikTok">
                                <img src="images/icons/tiktok.svg" alt="TikTok">
                            </a>
                            <a href="#" aria-label="X">
                                <img src="images/icons/x.svg" alt="X">
                            </a>
                            <a href="#" aria-label="YouTube">
                                <img src="images/icons/youtube.svg" alt="YouTube">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>

        <!-- MODAL SIMPLE (1 botón) -->
        <div id="modal-info" class="modal">
            <div class="modal-contenido">
                <p id="modal-info-texto"></p>
                <button id="modal-info-ok" class="modal-btn primary">Aceptar</button>
            </div>
        </div>

        <!-- MODAL CONFIRMACIÓN (2 botones) -->
        <div id="modal-confirm" class="modal">
            <div class="modal-contenido">
                <p id="modal-confirm-texto"></p>
                <div class="modal-actions">
                    <button id="modal-confirm-cancel" class="modal-btn secondary">Cancelar</button>
                    <button id="modal-confirm-ok" class="modal-btn primary">Aceptar</button>
                </div>
            </div>
        </div>
        
        <!-- JS -->
        <script src="scripts/header-auth.js"></script>
        <script src="scripts/country.js" defer></script>
        <script src="scripts/footer-hamburger.js"></script>
    </body>
</html>
