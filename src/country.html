<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>País | TravelWorld</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style/styles.css" />
</head>

<body>

  <!-- CABECERA -->
  <header>
    <nav class="nav">
      <div class="nav-left">
        <a href="#" class="logo">Logo</a>
        <div class="nav-links">
          <a href="continent.html?name=Europa">Europa</a>
          <a href="continent.html?name=Asia">Asia</a>
          <a href="continent.html?name=África">África</a>
          <a href="continent.html?name=Oceanía">Oceanía</a>
          <a href="continent.html?name=América del Norte">Norte América</a>
          <a href="continent.html?name=América del Sur">Sur América</a>
        </div>
      </div>

      <div class="nav-right">
        <button class="nav-icon">ES</button>
        <button class="nav-icon">A+</button>
        <button class="btn-nav secondary">Iniciar sesión</button>
        <button class="btn-nav">Registro</button>
      </div>
    </nav>
  </header>

  <!-- TÍTULO DEL PAÍS -->
  <section class="country-header-banner">
      <div class="country-header-content">
          <img id="country-flag" class="country-flag" alt="Bandera del país">
          <h1 id="country-name"></h1>
          <div class="underline"></div>
          <p id="country-subtitle"></p>
      </div>
  </section>




  <!-- GRID DE CIUDADES -->
  <section class="cities-grid" id="cities-container"></section>

  <!-- SEGURIDAD -->
  <section class="safety-box">
    <p>Infórmate sobre la seguridad en este país</p>
    <a class="safety-button" id="safety-button">Quiero saber más</a>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div>TravelWorld © 2025</div>
      <div class="footer-links">
        <a href="#">¿Quiénes somos?</a>
        <a href="#">Política de privacidad</a>
        <a href="#">FAQ</a>
        <a href="#">Contacto</a>
      </div>
      <div class="footer-social">
        <a>T</a>
        <a>IG</a>
        <a>X</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="scripts/country.js" defer></script>
</body>
</html>
