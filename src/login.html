<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Camino de Ulises</title>
    <link rel="stylesheet" href="style/styles.css">
</head>

<body class="login-page">

    <!-- HEADER (el mismo que en tu home) -->
    <header>
        <nav class="nav">

            <div class="nav-left">
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="Logo">
                </div>

                <ul class="nav-menu">
                    <li><a href="continent-page.html">Continentes</a></li>
                    <li><a href="forum-page.html">Foro</a></li>
                    <li><a href="security-page.html">¿Quiénes somos?</a></li>
                </ul>
            </div>

            <div class="nav-right">
                <button class="icon-btn">🌐︎</button>
                <button class="icon-btn">♿︎</button>
            </div>

        </nav>
    </header>


    <!-- FORMULARIO -->
    <main class="login-container">

        <div class="login-box">

            <h2>Inicio de sesión</h2>
            <div class="separator"></div>

            <form>
                <label for="user">Usuario</label>
                <input type="text" id="user" required>

                <label for="pass">Contraseña</label>
                <input type="password" id="pass" required>

                <button type="submit" class="login-btn">Iniciar sesión</button>
            </form>

            <div class="register-link">
                <p>¿No tienes cuenta?</p>
                <a href="register-page.html">Crear una cuenta</a>
            </div>

        </div>
    </main>


    <!-- FOOTER (igual que en tu home) -->
    <footer>
        <div class="footer-content">

            <div class="footer-left">
                <p>Camino de Ulises © 2025</p>
            </div>

            <nav class="footer-center">
                <a href="security-page.html">¿Quiénes somos?</a>
                <a href="#">Política de privacidad</a>
                <a href="#">FAQs</a>
                <a href="contact.html">Contacto</a>
            </nav>

            <div class="footer-right">
                <a href="#"><img src="../assets/icons/instagram.svg"></a>
                <a href="#"><img src="../assets/icons/tiktok.svg"></a>
                <a href="#"><img src="../assets/icons/x.svg"></a>
                <a href="#"><img src="../assets/icons/youtube.svg"></a>
            </div>
        </div>
    </footer>

</body>
</html>
