<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciudad | TravelWorld</title>

  <link rel="stylesheet" href="style/city.css">
</head>

<body>

  <!-- ▬▬▬ NAVBAR ▬▬▬ -->
  <header>
    <nav class="nav">
      <div class="nav-left">
        <a href="#" class="logo">Logo</a>
        <div class="nav-links">
          <a href="continent.html?name=Europa">Europa</a>
          <a href="continent.html?name=Asia">Asia</a>
          <a href="continent.html?name=África">África</a>
          <a href="continent.html?name=Oceanía">Oceanía</a>
          <a href="continent.html?name=América del Norte">Norte América</a>
          <a href="continent.html?name=América del Sur">Sur América</a>
        </div>
      </div>

      <div class="nav-right">
        <button class="nav-icon">ES</button>
        <button class="nav-icon">A+</button>
        <button class="btn-nav secondary">Iniciar sesión</button>
        <button class="btn-nav">Registro</button>
      </div>
    </nav>
  </header>

  <!-- ▬▬▬ BANNER CIUDAD ▬▬▬ -->
  <section class="city-banner">
    <img id="city-banner-img" alt="Imagen de la ciudad">
    
    <div class="city-banner-info">
      <h1 id="city-title"></h1>
      <p id="city-slogan"></p>

      <a href="#packs-section" class="banner-button">Ver packs</a>
    </div>
  </section>

  <!-- ▬▬▬ DESCRIPCIÓN EXTENDIDA ▬▬▬ -->
  <section class="city-detail">
    <div class="city-photo">
      <img id="city-vertical-img" alt="Imagen vertical ciudad">
      <p class="city-photo-caption" id="city-footer"></p>
    </div>

    <div class="city-description">
      <p id="city-description-text"></p>
    </div>
  </section>

  <!-- ▬▬▬ PACKS ▬▬▬ -->
  <section class="packs" id="packs-section">
    <h2>Consigue tu pack</h2>
    <div class="packs-title-line"></div>
    <p class="packs-subtitle">Elige la duración que mejor se adapte a tu aventura</p>


    <div class="packs-grid">

      <div class="pack-card">
        <h3>Fin de semana</h3>
        <div class="pack-img">
          <img id="city-pack-img-1" alt="Imagen pack fin de semana">
        </div>
        <p class="pack-price" id="pack-price-1">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

      <div class="pack-card">
        <h3>7 días</h3>
        <div class="pack-img">
          <img id="city-pack-img-2" alt="Imagen pack 7 días">
        </div>
        <p class="pack-price" id="pack-price-2">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

      <div class="pack-card">
        <h3>15 días</h3>
        <div class="pack-img">
          <img id="city-pack-img-3" alt="Imagen pack 15 días">
        </div>
        <p class="pack-price" id="pack-price-3">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

    </div>
  </section>

  <!-- ▬▬▬ FOOTER ▬▬▬ -->
  <footer>
    <div class="footer-inner">
      <div>TravelWorld © 2025</div>
      <div class="footer-links">
        <a href="#">¿Quiénes somos?</a>
        <a href="#">Política de privacidad</a>
        <a href="#">FAQ</a>
        <a href="#">Contacto</a>
      </div>
      <div class="footer-social">
        <a>T</a>
        <a>IG</a>
        <a>X</a>
      </div>
    </div>
  </footer>

  <script src="scripts/city.js"></script>
</body>
</html>
