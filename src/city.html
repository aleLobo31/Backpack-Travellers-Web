<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciudad | TravelWorld</title>
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="style/city.css">
</head>

<body>

  <!-- HEADER -->
  <header>
      <nav class="nav">

          <!-- IZQUIERDA: LOGO + MENÚ -->
          <div class="nav-left">
              <div class="logo">
                  <img src="../assets/images/logo.png" alt="Logo">
              </div>
              
              <ul class="nav-menu">
                  <li><a href="main-page.html">Home</a></li>
                  <li><a href="main-page.html#continentes">Continentes</a></li>
                  <li><a href="forum-page.html">Foro</a></li>
                  <li><a href="footer-sites.html?section=quienes-somos">¿Quiénes somos?</a></li>
              </ul>
          </div>

          <!-- DERECHA: ICONOS Y BOTONES -->
          <div class="nav-right">
              <button class="icon-btn" id="language-btn">🌐︎</button>
              <button class="icon-btn" id="accessibility-btn">♿︎</button>
              <a href="login.html" class="btn-login">Iniciar sesión</a>
              <a href="register-page.html" class="btn-register">Registrarse</a>

          </div>

      </nav>
  </header>

  <!-- ▬▬▬ BANNER CIUDAD ▬▬▬ -->
  <section class="city-banner">
    <img id="city-banner-img" alt="Imagen de la ciudad">
    
    <div class="city-banner-info">
      <h1 id="city-title"></h1>
      <p id="city-slogan"></p>

      <a href="#packs-section" class="banner-button">Ver packs</a>
    </div>
  </section>

  <!-- ▬▬▬ DESCRIPCIÓN EXTENDIDA ▬▬▬ -->
  <section class="city-detail">
    <div class="city-photo">
      <img id="city-vertical-img" alt="Imagen vertical ciudad">
      <p class="city-photo-caption" id="city-footer"></p>
    </div>

    <div class="city-description">
      <p id="city-description-text"></p>
    </div>
  </section>

  <!-- ▬▬▬ PACKS ▬▬▬ -->
  <section class="packs" id="packs-section">
    <h2>Consigue tu pack</h2>
    <div class="packs-title-line"></div>
    <p class="packs-subtitle">Elige la duración que mejor se adapte a tu aventura</p>


    <div class="packs-grid">

      <div class="pack-card">
        <h3>Fin de semana</h3>
        <div class="pack-img">
          <img id="city-pack-img-1" alt="Imagen pack fin de semana">
        </div>
        <p class="pack-price" id="pack-price-1">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

      <div class="pack-card">
        <h3>7 días</h3>
        <div class="pack-img">
          <img id="city-pack-img-2" alt="Imagen pack 7 días">
        </div>
        <p class="pack-price" id="pack-price-2">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

      <div class="pack-card">
        <h3>15 días</h3>
        <div class="pack-img">
          <img id="city-pack-img-3" alt="Imagen pack 15 días">
        </div>
        <p class="pack-price" id="pack-price-3">Precio</p>
        <button class="pack-button">Comprar</button>
      </div>

    </div>
  </section>

  <!-- ▬▬▬ FOOTER ▬▬▬ -->
    <!-- FOOTER -->
  <footer>
      <div class="footer-content">

          <!-- IZQUIERDA -->
          <div class="footer-left">
              <p>Camino de Ulises © 2025</p>
          </div>

          <!-- CENTRO -->
          <nav class="footer-center">
              <a href="footer-sites.html?section=quienes-somos">¿Quiénes somos?</a>
              <a href="footer-sites.html?section=privacidad">Política de privacidad</a>
              <a href="footer-sites.html?section=faq">FAQs</a>
              <a href="footer-sites.html?section=contacto">Contacto</a>
          </nav>


          <!-- DERECHA -->
          <div class="footer-right">
              <a href="#" aria-label="Instagram">
                  <img src="../assets/icons/instagram.svg" alt="Instagram">
              </a>
              <a href="#" aria-label="TikTok">
                  <img src="../assets/icons/tiktok.svg" alt="TikTok">
              </a>
              <a href="#" aria-label="X">
                  <img src="../assets/icons/x.svg" alt="X">
              </a>
              <a href="#" aria-label="YouTube">
                  <img src="../assets/icons/youtube.svg" alt="YouTube">
              </a>
      </div>
  </footer>

  <script src="scripts/city.js"></script>
</body>
</html>
